# Serviços para DESENVOLVIMENTO (PostgreSQL + Redis + backend Django).
# Uso: docker compose up -d
# O frontend roda diretamente na máquina (ver README.md).
services:
  postgres:
    image: postgres:16
    container_name: sist-postgres
    environment:
      POSTGRES_DB: sist
      POSTGRES_USER: sist
      POSTGRES_PASSWORD: sist
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - sist_pgdata:/var/lib/postgresql/data
    networks:
      default:
        ipv4_address: 172.28.0.10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: sist-redis
    ports:
      - "6379:6379"
    networks:
      default:
        ipv4_address: 172.28.0.11
    restart: unless-stopped

  # Django em Linux: no Windows com Smart App Control as DLLs dos drivers
  # PostgreSQL são bloqueadas. Lê backend/.env; as variáveis abaixo têm prioridade.
  backend:
    build: ./backend
    container_name: sist-backend
    env_file: ./backend/.env
    environment:
      # IPs fixos: o DNS interno do Docker Desktop falhou nesta máquina
      DATABASE_URL: postgres://sist:sist@172.28.0.10:5432/sist
      REDIS_URL: redis://172.28.0.11:6379/0
      # Conexões publicadas pelo Docker chegam pelo gateway da rede (BFF Next.js na máquina)
      TRUSTED_PROXY_IPS: 127.0.0.1,::1,172.28.0.1
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  sist_pgdata:
